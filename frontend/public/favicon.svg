<svg viewBox="0 0 420 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="petal" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#DE7B93"/>
      <stop offset="100%" stop-color="#F6C9D3"/>
    </linearGradient>
    <linearGradient id="petalLight" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#EFA9B9"/>
      <stop offset="100%" stop-color="#FBE1E6"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#87A17F"/>
      <stop offset="100%" stop-color="#4F6A4B"/>
    </linearGradient>
  </defs>

  <rect width="420" height="420" fill="#FBF1EC"/>

  <circle cx="210" cy="210" r="168" fill="none" stroke="#D9A6B6" stroke-width="1.4"/>
  <circle cx="330" cy="80" r="4" fill="#D9718A"/>
  <circle cx="352" cy="98" r="2.4" fill="#D9718A"/>

  <!-- leaves, symmetric behind flower -->
  <g transform="translate(210,235)">
    <path d="M -70,10 C -95,-10 -100,-55 -78,-85 C -50,-70 -42,-30 -70,10 Z" fill="url(#leaf)" opacity="0.92"/>
    <path d="M 70,10 C 95,-10 100,-55 78,-85 C 50,-70 42,-30 70,10 Z" fill="url(#leaf)" opacity="0.85"/>
  </g>

  <!-- lotus bloom: symmetric fan of petals from a single base point -->
  <g transform="translate(210,255)">
    <!-- back/outer petals (lighter) -->
    <g fill="url(#petalLight)">
      <path d="M 0,0 C -20,-14 -26,-64 0,-118 C 26,-64 20,-14 0,0 Z" transform="rotate(-52)"/>
      <path d="M 0,0 C -20,-14 -26,-64 0,-118 C 26,-64 20,-14 0,0 Z" transform="rotate(52)"/>
    </g>
    <!-- middle petals -->
    <g fill="url(#petal)">
      <path d="M 0,0 C -17,-12 -22,-56 0,-104 C 22,-56 17,-12 0,0 Z" transform="rotate(-26)"/>
      <path d="M 0,0 C -17,-12 -22,-56 0,-104 C 22,-56 17,-12 0,0 Z" transform="rotate(26)"/>
    </g>
    <!-- center petal (front, tallest) -->
    <path d="M 0,0 C -14,-10 -18,-50 0,-96 C 18,-50 14,-10 0,0 Z" fill="url(#petal)"/>
    <!-- stamen center -->
    <circle cx="0" cy="-4" r="7" fill="#C98A3D"/>
  </g>

  <!-- bud, upper left, tucked outside the bloom -->
  <g transform="translate(96,132) rotate(-10)">
    <ellipse cx="0" cy="0" rx="9" ry="20" fill="url(#petal)"/>
    <line x1="0" y1="20" x2="0" y2="58" stroke="#6C8267" stroke-width="3"/>
  </g>
</svg>
